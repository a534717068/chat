<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode Go 直连测试</title>
<style>
body {
    font-family: sans-serif;
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
    line-height: 1.6;
}
button {
    padding: 10px 16px;
    margin: 6px 4px 6px 0;
    cursor: pointer;
}
input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    margin: 8px 0;
}
pre {
    background: #f5f5f5;
    padding: 15px;
    white-space: pre-wrap;
    word-break: break-word;
}
.success {
    color: green;
}
.error {
    color: red;
}
</style>
</head>

<body>

<h1>OpenCode Go 浏览器直连测试</h1>

<p>
这个页面只用于测试 GitHub Pages 浏览器能否直接访问 OpenCode Go。
</p>

<hr>

<h2>① 测试 Models API</h2>

<button onclick="testModels()">测试 /models</button>

<pre id="modelsResult">尚未测试</pre>

<hr>

<h2>② 测试 Chat API</h2>

<p>请输入你的 OpenCode Go API Key：</p>

<input
    id="apiKey"
    type="password"
    placeholder="粘贴你的 OpenCode Go API Key"
>

<button onclick="testChat()">发送测试请求</button>

<pre id="chatResult">尚未测试</pre>

<hr>

<script>

const GO_MODELS_URL =
    "https://opencode.ai/zen/go/v1/models";

const GO_CHAT_URL =
    "https://opencode.ai/zen/go/v1/chat/completions";

function log(id, text, success = false) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = success ? "success" : "";
}

/*
 * 生成一个稳定的浏览器 Session ID。
 *
 * 第一次打开页面时生成；
 * 之后保存在 localStorage。
 */
function getSessionId() {

    let id = localStorage.getItem(
        "opencode_test_session"
    );

    if (!id) {

        id = crypto.randomUUID();

        localStorage.setItem(
            "opencode_test_session",
            id
        );
    }

    return id;
}


/*
 * 测试 /models
 *
 * 这个请求不需要 API Key。
 */
async function testModels() {

    log(
        "modelsResult",
        "正在请求 OpenCode Go /models ..."
    );

    try {

        const response = await fetch(
            GO_MODELS_URL,
            {
                method: "GET"
            }
        );

        const text = await response.text();

        log(
            "modelsResult",
            "HTTP 状态码："
            + response.status
            + "\n\n"
            + text,
            response.ok
        );

    } catch (error) {

        log(
            "modelsResult",
            "请求失败：\n\n"
            + error
        );
    }
}


/*
 * 测试真正的 Chat Completions。
 */
async function testChat() {

    const apiKey =
        document.getElementById("apiKey").value.trim();

    if (!apiKey) {

        alert("请先输入 API Key");

        return;
    }

    log(
        "chatResult",
        "正在请求 OpenCode Go ..."
    );

    const sessionId = getSessionId();

    try {

        const response = await fetch(
            GO_CHAT_URL,
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + apiKey,

                    "x-opencode-session":
                        sessionId,

                    "User-Agent":
                        "my-personal-web-app/1.0"
                },

                body: JSON.stringify({

                    model:
                        "deepseek-v4-flash",

                    messages: [

                        {
                            role: "user",

                            content:
                                "只回复：测试成功"
                        }

                    ],

                    stream: false
                })
            }
        );

        const text = await response.text();

        log(
            "chatResult",

            "HTTP 状态码："
            + response.status
            + "\n\n"

            + "Session ID："
            + sessionId
            + "\n\n"

            + text,

            response.ok
        );

    } catch (error) {

        log(
            "chatResult",

            "浏览器请求失败：\n\n"
            + error
            + "\n\n"
            + "如果这里出现 CORS / Failed to fetch，"
            + "很可能就是 Go API 不允许浏览器跨域直连。"
        );
    }
}

</script>

</body>
</html>
